name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # Runs every checks.<system>.* output, including docs-up-to-date --
      # fails if docs/options.md wasn't regenerated (`nix run .#gen-docs`)
      # after an option changed.
      - run: nix flake check
